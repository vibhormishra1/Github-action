name: Generate podcast feed
on: [push]
jobs:
  build:
   run-on: ubuntu-latest
   steps:
    -name: Checkout Repo
    uses: actions/checkout@v3
    -name: Setup python
    uses: actions/setup-python@v4
    with:
    python-version: '3.10'
    - name: Install Dependencies
    run: |
    python -m pip install --upgrade pip
    pip install pyyaml
    -name: Run feed Generator
    run: python feed.py
    - name: Push repo
    run: |
    git config vibhormishra1 github-actions
    git config vibhormishra0705@gamil.com github-actions@github.com
    git add .
    git commit -m "Modified Feed"
    git push 
    
    
